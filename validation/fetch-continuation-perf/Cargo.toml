[package]
name = "fetch-continuation-perf"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["continuation", "standard"]
standard = ["continuation"]
continuation = []
allocations = []

[dependencies]
dynamo-kv-router = { path = "../../lib/kv-router" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
debug = 1
